# Pulls the static dashboard bundle named in release.txt, checks its sha256, and commits the files.
# The site has no data in it; data loads from Supabase only after an allow-listed user signs in.
name: sync-site
on:
  push:
    paths: [release.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync-site
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and unpack bundle
        run: |
          set -euo pipefail
          URL=$(sed -n 's/^url=//p' release.txt)
          SHA=$(sed -n 's/^sha256=//p' release.txt)
          curl -fsSL --retry 3 "$URL" -o /tmp/b.tgz
          echo "$SHA  /tmp/b.tgz" | sha256sum -c -
          mkdir /tmp/b && tar xzf /tmp/b.tgz -C /tmp/b --no-same-owner
          find . -maxdepth 1 -mindepth 1 ! -name .git ! -name .github ! -name release.txt ! -name README.md ! -name deploy.txt -exec rm -rf {} +
          cp -a /tmp/b/. .
          git config user.name "dash-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Sync site bundle ${SHA:0:16}" && git push; fi
